name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  PROJECT_MODULE: stream_quilt
  PROJECT_TITLE: Stream Quilt

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Required only to check out the tagged source.
      checks: read # Required to verify the cross-platform CI gate for this commit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: false
      - name: Require tagged source on main with a successful CI gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          successful_gates="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "CI gate" and .conclusion == "success" and .app.slug == "github-actions")] | length')"
          successful_codeql="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "CodeQL analysis" and .conclusion == "success" and .app.slug == "github-actions")] | length')"
          test "${successful_gates}" -gt 0
          test "${successful_codeql}" -gt 0
      - name: Synchronize locked release environment
        run: uv sync --frozen --extra dev
      - name: Derive the reproducible archive timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
      - name: Verify tag and package version
        run: |
          uv run --frozen --extra dev python - <<'PY'
          import importlib
          import os
          import pathlib
          import tomllib

          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          exported = importlib.import_module(os.environ["PROJECT_MODULE"]).__version__
          tag = os.environ["GITHUB_REF_NAME"]
          if declared != exported or tag != f"v{declared}":
              raise SystemExit(f"version mismatch: tag={tag!r}, pyproject={declared!r}, package={exported!r}")
          PY
      - name: Run release gates
        run: |
          uv run --frozen --extra dev python -m ruff check .
          uv run --frozen --extra dev python -m ruff format --check .
          uv run --frozen --extra dev python -m pytest
      - name: Build and inspect distributions
        run: |
          uv run --frozen --extra dev python -m build --no-isolation
          uv run --frozen --extra dev python -m twine check dist/*
          uv run --frozen --extra dev check-wheel-contents dist/*.whl
      - name: Smoke-test wheel in isolation
        run: |
          python -m venv "${RUNNER_TEMP}/release-venv"
          uv export --frozen --no-dev --no-emit-project --output-file "${RUNNER_TEMP}/runtime-requirements.txt"
          uv pip install --python "${RUNNER_TEMP}/release-venv/bin/python" --require-hashes --requirements "${RUNNER_TEMP}/runtime-requirements.txt"
          uv pip install --python "${RUNNER_TEMP}/release-venv/bin/python" --no-deps dist/*.whl
          "${RUNNER_TEMP}/release-venv/bin/python" -c "import importlib, os; module = importlib.import_module(os.environ['PROJECT_MODULE']); assert module.__version__ == os.environ['GITHUB_REF_NAME'][1:]"
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Transfer verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to create the GitHub release and upload its assets.
      id-token: write # Required for the short-lived Sigstore identity token.
      attestations: write # Required to store GitHub artifact attestations.
      artifact-metadata: write # Required to persist artifact metadata for the attestation.
    steps:
      - name: Retrieve verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-distributions
          path: dist/
      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} already exists; published assets are immutable."
            exit 1
          fi
          draft_created=0
          cleanup_draft() {
            if test "${draft_created}" -eq 1; then
              gh release delete "${GITHUB_REF_NAME}" --yes || true
            fi
          }
          trap cleanup_draft ERR
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --generate-notes --title "${PROJECT_TITLE} ${GITHUB_REF_NAME}"
          draft_created=1
          gh release upload "${GITHUB_REF_NAME}" dist/*
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          draft_created=0
          trap - ERR
