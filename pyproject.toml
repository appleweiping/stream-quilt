[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "stream-quilt"
version = "0.4.0"
description = "Deterministic alignment and watermarking for multimodal event streams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "appleweiping" }]
maintainers = [{ name = "appleweiping" }]
keywords = ["multimodal", "streaming", "alignment", "watermark", "timeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/appleweiping/stream-quilt"
Repository = "https://github.com/appleweiping/stream-quilt"
Issues = "https://github.com/appleweiping/stream-quilt/issues"

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "build>=1.2",
  "check-wheel-contents>=0.6",
  "coverage[toml]>=7.6",
  "hatchling==1.32.0",
  "mypy>=1.15",
  "pytest>=8",
  "ruff>=0.8",
  "twine>=7.0",
]

[project.scripts]
stream-quilt = "stream_quilt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_quilt"]

[tool.hatch.build.targets.sdist]
include = [
  "/benchmarks",
  "/docs",
  "/examples",
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/GOVERNANCE.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stream_quilt"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PIE"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.bandit]
targets = ["src"]
# B105: the flagged assignment is `_TOKEN`, an RFC 7230 token character class used to
# validate a CloudEvents `datacontenttype` media type. Bandit matches the *variable
# name* against its password-like word list; the value is a regex fragment, not a
# credential. This package is dependency-free and has no authentication, secret, or
# network surface for a hardcoded password to exist in.
skips = ["B105"]
