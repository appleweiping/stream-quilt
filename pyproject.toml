[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-quilt"
version = "0.1.0"
description = "Deterministic alignment and watermarking for multimodal event streams"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Stream Quilt contributors" }]
keywords = ["multimodal", "streaming", "alignment", "watermark", "timeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/appleweiping/stream-quilt"
Repository = "https://github.com/appleweiping/stream-quilt"
Issues = "https://github.com/appleweiping/stream-quilt/issues"

[project.optional-dependencies]
dev = ["coverage[toml]>=7.6", "pytest>=8", "ruff>=0.8"]

[project.scripts]
stream-quilt = "stream_quilt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stream_quilt"]

[tool.coverage.report]
fail_under = 94
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PIE"]
