[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-quilt"
version = "0.2.0"
description = "Deterministic alignment and watermarking for multimodal event streams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "appleweiping" }]
maintainers = [{ name = "appleweiping" }]
keywords = ["multimodal", "streaming", "alignment", "watermark", "timeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/appleweiping/stream-quilt"
Repository = "https://github.com/appleweiping/stream-quilt"
Issues = "https://github.com/appleweiping/stream-quilt/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "coverage[toml]>=7.6", "pytest>=8", "ruff>=0.8", "twine>=7.0"]

[project.scripts]
stream-quilt = "stream_quilt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stream_quilt = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stream_quilt"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PIE"]
